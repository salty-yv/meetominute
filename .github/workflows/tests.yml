name: Windows tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Install application and test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run automated tests
        run: python -m pytest

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Check browser JavaScript syntax
        run: node --check app/static/app.js
