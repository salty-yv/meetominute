<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f1efe8">
  <meta name="description" content="MeetOminute：在本机完成会议录音转写、校对与可信纪要生成。">
  <title>{% block title %}MeetOminute{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ url_for('index') }}" aria-label="MeetOminute 首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" role="img">
            <path d="M8 24V16M14 29V11M20 25V15M26 31V9M32 23V17"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>MeetOminute</strong>
          <small>可信会议工作台</small>
        </span>
      </a>

      <nav class="primary-nav" aria-label="主导航">
        <a href="{{ url_for('index') }}" {% if request.url.path == '/' %}class="active" aria-current="page"{% endif %}>工作台</a>
        <a href="{{ url_for('index') }}#meeting-history">会议记录</a>
        <a href="{{ url_for('calendar_page') }}" {% if request.url.path == '/calendar' %}class="active" aria-current="page"{% endif %}>日历</a>
        <a href="{{ url_for('archive_page') }}" {% if request.url.path in ['/archive', '/trash', '/backups'] %}class="active" aria-current="page"{% endif %}>资料库</a>
        <a href="{{ url_for('minutes_templates_page') }}" {% if request.url.path.startswith('/minutes-templates') %}class="active" aria-current="page"{% endif %}>纪要模板</a>
        <a href="{{ url_for('external_llm_settings') }}" {% if request.url.path == '/settings/external-llm' %}class="active" aria-current="page"{% endif %}>外部 LLM</a>
        <a href="{{ url_for('diagnostics_page') }}" {% if request.url.path == '/diagnostics' %}class="active" aria-current="page"{% endif %}>运行诊断</a>
      </nav>

      <div class="header-actions">
        <a class="settings-shortcut" href="{{ url_for('external_llm_settings') }}" title="配置外部 LLM">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/><circle cx="12" cy="12" r="3.5"/></svg>
          <span>模型设置</span>
        </a>
        <a class="settings-shortcut" href="{{ url_for('diagnostics_page') }}" title="检查本地运行环境">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h3l2-6 4 11 2-5h5"/><path d="M4 4h16v16H4z"/></svg>
          <span>运行诊断</span>
        </a>
        <span class="privacy-badge">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.5 10V7.5a4.5 4.5 0 0 1 9 0V10M6 10h12v10H6z"/>
          </svg>
          数据留在本机
        </span>
      </div>
    </div>
  </header>

  <main class="page-shell" id="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>MeetOminute · Local-first meeting intelligence</span>
      <span class="footer-note"><i aria-hidden="true"></i>仅监听 127.0.0.1，不开放公网端口</span>
    </div>
  </footer>

  <div class="toast-region" data-toast-region role="status" aria-live="polite"></div>
</body>
</html>
